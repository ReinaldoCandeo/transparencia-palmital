name: Vercel Cron Shallow (Guardiano)

on:
  schedule:
    # Roda a cada 8 horas para proteger os processos vivos e atualizar movimentações
    - cron: '0 0,8,16 * * *'
  # Permite disparar o script manualmente pelo painel do GitHub se precisar
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Shallow Sync na Vercel
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/sync?mode=shallow" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -f
