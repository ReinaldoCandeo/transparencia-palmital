name: Vercel Cron Sync (Hourly)

on:
  schedule:
    # Roda a cada hora (ex: 13:00, 14:00, 15:00)
    - cron: '0 * * * *'
  # Permite disparar o script manualmente pelo painel do GitHub se precisar
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Sincronização na Vercel
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/sync" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -f
